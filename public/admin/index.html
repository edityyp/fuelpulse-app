<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FuelPulse Admin</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f7fc;color:#14213d}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.card{background:#fff;border:1px solid #dfe7f2;border-radius:18px;padding:28px;box-shadow:0 12px 35px #172b4d12;margin-bottom:20px}h1{margin:6px 0 8px;font-size:32px}h2{margin-top:0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#1754bd}.muted{color:#6b7890}label{display:block;font-weight:700;margin:16px 0}input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:12px 13px;border:1px solid #cbd7e6;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:11px 16px;font-weight:750;cursor:pointer;background:#edf2f8;color:#17233b}button.primary{background:#1754bd;color:white}button:disabled{opacity:.55;cursor:not-allowed}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.login{max-width:460px;margin:9vh auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.notice{padding:12px 14px;border-radius:10px;background:#fff2df;margin-bottom:20px}.success{background:#eaf8ef}.cred{display:grid;gap:10px}.cred div{display:flex;align-items:center;gap:10px;padding:12px;background:#f6f8fb;border-radius:10px}.cred span{flex:1;font-family:ui-monospace,monospace;word-break:break-all}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e7edf5}code{background:#eef3fa;padding:3px 6px;border-radius:5px}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.wrap{padding:22px 14px}}</style></head>
<body><div id="app"></div><script>
const app=document.getElementById('app');
const api=async(path,body)=>{const r=await fetch('/api'+path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let orgs=[];
function login(){app.innerHTML='<div class="wrap"><div class="card login"><div class="eyebrow">PRIVATE CONTROL PLANE</div><h1>FuelPulse Admin</h1><p class="muted">Private provisioning portal. This is separate from the normal FuelPulse application.</p><div id="n"></div><form id="f"><label>Admin password<input id="p" type="password" minlength="16" autocomplete="current-password" required></label><button class="primary">Enter Admin</button></form></div></div>';document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{await api('/admin/login',{password:document.getElementById('p').value});dashboard()}catch(x){document.getElementById('n').innerHTML='<div class="notice">'+esc(x.message)+'</div>'}}}
async function dashboard(){try{orgs=await api('/admin/organizations')}catch(x){login();return}app.innerHTML='<div class="wrap"><div class="top"><div><div class="eyebrow">CONTROL PLANE</div><h1>Customer provisioning</h1><p class="muted">Create isolated organizations and generate owner credentials.</p></div><button id="out">Sign out</button></div><div id="n"></div><div class="grid"><div class="card"><h2>New owner</h2><form id="create"><label>Business / organization name<input name="organizationName" placeholder="Example Fuel Station" maxlength="120" required></label><label>Station ID<input name="stationId" placeholder="example-fuel" pattern="[a-z0-9][a-z0-9-]{2,62}" required></label><label>Owner name<input name="ownerName" placeholder="Owner name" maxlength="120" required></label><button class="primary">Generate owner credentials</button></form></div><div id="created"></div></div><div class="card"><div class="top"><h2>Organizations</h2><button id="refresh">Refresh</button></div><div id="list"></div></div></div>';renderOrgs();document.getElementById('out').onclick=async()=>{await api('/admin/logout',{});login()};document.getElementById('refresh').onclick=async()=>{orgs=await api('/admin/organizations');renderOrgs()};document.getElementById('create').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.currentTarget));try{const d=await api('/admin/owners',b);document.getElementById('created').innerHTML='<div class="card success"><h2>Owner created</h2><p>Save these credentials now. The generated password will not be shown again.</p><div class="cred">'+[['Station ID',d.station_slug],['Owner code',d.owner_code],['Temporary password',d.ownerPassword]].map(([a,v])=>'<div><b>'+a+'</b><span>'+esc(v)+'</span><button type="button" onclick="navigator.clipboard.writeText('+JSON.stringify(v)+')">Copy</button></div>').join('')+'</div></div>';orgs=await api('/admin/organizations');renderOrgs();e.currentTarget.reset()}catch(x){document.getElementById('n').innerHTML='<div class="notice">'+esc(x.message)+'</div>'}}}
function renderOrgs(){document.getElementById('list').innerHTML=orgs.length?'<table><thead><tr><th>Organization</th><th>Station ID</th><th>Active users</th><th>Created</th></tr></thead><tbody>'+orgs.map(o=>'<tr><td>'+esc(o.name)+'</td><td><code>'+esc(o.slug)+'</code></td><td>'+esc(o.active_users)+'</td><td>'+new Date(o.created_at).toLocaleDateString('en-IN')+'</td></tr>').join('')+'</tbody></table>':'<p class="muted">No customer organizations yet.</p>'}
api('/admin/me').then(dashboard).catch(login);
</script></body></html>
