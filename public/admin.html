<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>FuelPulse Admin</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f7fc;color:#172033}main{max-width:1180px;margin:0 auto;padding:28px 18px}.card{background:#fff;border:1px solid #dfe6f2;border-radius:18px;padding:22px;box-shadow:0 12px 40px #17345a12;margin-bottom:18px}h1,h2,h3{margin:0 0 8px}p{color:#68758a}label{display:block;font-weight:650;margin:12px 0 6px}input,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:white}button{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:#1754bd;color:white}.secondary{background:#e8eef8;color:#17345a}.danger{background:#fee2e2;color:#991b1b}.success{background:#eefbf3}.warning{background:#fff7df}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.error{color:#b42318;background:#fff0f0;padding:10px;border-radius:9px}.muted{text-align:center;padding:18px 0;color:#68758a}.hint{font-size:12px;color:#64748b;margin-top:5px}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;margin-left:6px}.enabled{background:#dcfce7;color:#166534}.disabled{background:#fee2e2;color:#991b1b}.active{background:#dcfce7;color:#166534}.expired{background:#fff7df;color:#92400e}.blocked{background:#fee2e2;color:#991b1b}.row{border-top:1px solid #edf0f5;padding:15px 0}.row:first-child{border-top:0}.row-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.org-name{font-weight:800}.meta{color:#68758a;font-size:12px;margin-top:4px}.subbox{margin-top:10px;background:#f7f9fc;border:1px solid #e5eaf2;border-radius:12px;padding:11px}.sub-actions{display:grid;grid-template-columns:115px 110px 125px 1fr;gap:7px;margin-top:9px}.sub-actions button{white-space:nowrap}.credential{margin-top:10px}.credential-label{font-weight:700;margin-bottom:4px}.credential-line{display:flex;gap:7px}.secret{flex:1;min-width:0;font-family:ui-monospace,monospace;background:#f5f7fa;padding:9px;border-radius:7px;word-break:break-all}.copied{background:#d1fae5;color:#065f46}.password-wrap{position:relative}.password-wrap input{padding-right:55px}.show-pass{position:absolute;right:5px;top:5px;background:transparent;color:#475569;padding:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{background:#fff;border:1px solid #dfe6f2;border-radius:14px;padding:14px}.stat b{font-size:23px;display:block}.stat span{font-size:11px;color:#68758a}.login{max-width:450px;margin:10vh auto}.small{font-size:11px;color:#64748b}@media(max-width:900px){.grid{grid-template-columns:1fr}.sub-actions{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:16px 11px}.header{flex-direction:column}.sub-actions{grid-template-columns:1fr}.row-head{flex-direction:column}}
</style>
</head>
<body><main><div id="app"></div></main>
<script>
'use strict';
const root=document.getElementById('app');
const BUILD='admin-2026-10-06.1';
const PLAN_LABEL={MONTHLY:'Monthly',QUARTERLY:'3 Months',HALF_YEAR:'6 Months',YEARLY:'1 Year'};
async function request(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(p){return '₹'+(Number(p||0)/100).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2})}
function date(v){return v?new Date(v).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}
function daysText(x){if(x==null)return 'No package';const n=Number(x);return n>0?n+' days left':n===0?'Due today':Math.abs(n)+' days overdue'}
function copyText(v,b){navigator.clipboard?.writeText(String(v)).then(()=>{const old=b.textContent;b.textContent='Copied';setTimeout(()=>b.textContent=old,1200)}).catch(()=>b.textContent='Copy failed')}
function passwordStrength(v){return v.length>=12&&/[A-Z]/.test(v)&&/[a-z]/.test(v)&&/\d/.test(v)&&/[^A-Za-z0-9]/.test(v)}
function login(){root.innerHTML='<div class="card login"><h1>FuelPulse Admin</h1><p>Private control panel for your petrol-pump customers.</p><form id="login"><label>Admin password</label><input id="password" type="password" autocomplete="current-password" minlength="12" required><button class="primary" style="margin-top:15px">Sign in</button><div id="msg"></div></form><div class="small">Build: '+BUILD+'</div></div>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await request('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});await dashboard()}catch(x){document.getElementById('msg').innerHTML='<p class="error">'+esc(x.message)+'</p>';b.disabled=false}}}
function packageOptions(selected){return Object.keys(PLAN_LABEL).map(k=>'<option value="'+k+'" '+(k===selected?'selected':'')+'>'+PLAN_LABEL[k]+'</option>').join('')}
async function renew(id){const plan=document.querySelector('[data-plan="'+id+'"]').value;const amount=Number(document.querySelector('[data-amount="'+id+'"]').value||0);const method=document.querySelector('[data-method="'+id+'"]').value;const ref=prompt('Payment reference / UTR (optional):','')??'';try{await request('/api/admin/subscriptions/'+encodeURIComponent(id)+'/renew',{method:'POST',body:JSON.stringify({planCode:plan,pricePaise:Math.round(amount*100),paymentMethod:method,paymentReference:ref})});await load()}catch(x){alert(x.message)}}
async function blockSub(id){const reason=prompt('Reason for blocking this station:','Payment pending')??'';if(!reason)return;try{await request('/api/admin/subscriptions/'+encodeURIComponent(id)+'/block',{method:'POST',body:JSON.stringify({reason})});await load()}catch(x){alert(x.message)}}
async function unblockSub(id){try{await request('/api/admin/subscriptions/'+encodeURIComponent(id)+'/unblock',{method:'POST',body:'{}'});await load()}catch(x){alert(x.message)}}
async function toggleOrg(id,active){if(!confirm((active?'Enable':'Disable')+' this station manually?'))return;try{await request('/api/admin/organizations/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({active})});await load()}catch(x){alert(x.message)}}
function render(rows){const active=rows.filter(x=>x.status==='ACTIVE'&&x.access_days_left>0).length,exp=rows.filter(x=>x.status==='EXPIRED').length,blocked=rows.filter(x=>x.status==='BLOCKED'||x.enabled===false).length,soon=rows.filter(x=>x.days_left!=null&&x.days_left<=10&&x.days_left>=0&&x.status==='ACTIVE').length;document.getElementById('stats').innerHTML='<div class="stat"><b>'+rows.length+'</b><span>Total stations</span></div><div class="stat"><b>'+active+'</b><span>Active packages</span></div><div class="stat"><b>'+soon+'</b><span>Expiring within 10 days</span></div><div class="stat"><b>'+blocked+'</b><span>Blocked / disabled</span></div>';const list=document.getElementById('list');list.innerHTML=rows.length?rows.map(x=>{const st=x.status||'NO_PACKAGE';const cls=st.toLowerCase().replace('_','-');const soonFlag=st==='ACTIVE'&&Number(x.days_left)<=10;return '<div class="row"><div class="row-head"><div><div class="org-name">'+esc(x.name)+' <span class="status '+(x.enabled?'enabled':'disabled')+'">'+(x.enabled?'Enabled':'Disabled')+'</span><span class="status '+cls+'">'+esc(st)+'</span></div><div class="meta">Station ID: <b>'+esc(x.slug)+'</b> · Owner users: '+esc(x.active_users??'—')+'</div></div><div class="meta">'+(soonFlag?'⚠️ Renew soon':'')+'</div></div><div class="subbox">'+(x.subscription_id?'<div><b>'+esc(PLAN_LABEL[x.plan_code]||x.plan_code)+'</b> · Expires <b>'+date(x.ends_at)+'</b> · '+esc(daysText(x.days_left))+' · Grace '+esc(x.grace_days)+' days</div><div class="meta">Package price: '+money(x.price_paise)+' · Last payment: '+date(x.last_payment_at)+' · Payment: '+esc(x.payment_status)+'</div><div class="sub-actions"><select data-plan="'+x.organization_id+'">'+packageOptions(x.plan_code)+'</select><input data-amount="'+x.organization_id+'" type="number" min="0" step="1" value="'+esc((Number(x.price_paise||0)/100).toFixed(0))+'" placeholder="Amount ₹"><select data-method="'+x.organization_id+'"><option>CASH</option><option>UPI</option><option>BANK</option><option>OTHER</option></select><button class="primary" data-renew="'+x.organization_id+'">Payment received / Renew</button></div><div class="actions" style="margin-top:8px"><button class="'+(st==='BLOCKED'?'primary':'danger')+'" data-block="'+x.organization_id+'">'+(st==='BLOCKED'?'Blocked':'Block access')+'</button>'+(st==='BLOCKED'?'<button class="secondary" data-unblock="'+x.organization_id+'">Unblock</button>':'')+'<button class="secondary" data-manual="'+x.organization_id+'" data-current="'+x.enabled+'">'+(x.enabled?'Disable station':'Enable station')+'</button></div></div>':'<div class="warning"><b>No subscription package yet.</b> Renew/package it below.</div><div class="sub-actions"><select data-plan="'+x.organization_id+'">'+packageOptions('MONTHLY')+'</select><input data-amount="'+x.organization_id+'" type="number" min="0" step="1" value="0" placeholder="Amount ₹"><select data-method="'+x.organization_id+'"><option>CASH</option><option>UPI</option><option>BANK</option><option>OTHER</option></select><button class="primary" data-renew="'+x.organization_id+'">Start package</button></div></div></div>'}).join(''):'<div class="muted">No stations created yet.</div>';list.querySelectorAll('[data-renew]').forEach(b=>b.onclick=()=>renew(b.dataset.renew));list.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>blockSub(b.dataset.block));list.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=()=>unblockSub(b.dataset.unblock));list.querySelectorAll('[data-manual]').forEach(b=>b.onclick=()=>toggleOrg(b.dataset.manual,b.dataset.current!=='true'))}
async function load(){const list=document.getElementById('list');if(!list)return;list.innerHTML='<div class="muted">Loading stations…</div>';try{const rows=await request('/api/admin/subscriptions');render(rows)}catch(x){list.innerHTML='<p class="error">'+esc(x.message)+'</p>'}}
async function dashboard(){try{await request('/api/admin/me')}catch{return login()}root.innerHTML='<div class="header"><div><h1>FuelPulse Admin</h1><p>Station ID + subscription control for your petrol-pump customers.</p><div class="small">Build: '+BUILD+'</div></div><div class="actions"><button id="refresh" class="secondary">Refresh</button><button id="logout" class="danger">Sign out</button></div></div><div id="stats" class="stats"></div><div class="grid"><section class="card"><h2>Create station owner</h2><p>Create the Station ID yourself, choose the first package, and issue the owner credentials.</p><form id="create"><label>Petrol pump / business name</label><input name="organizationName" placeholder="Sharma Fuel Station" minlength="2" maxlength="120" required><label>Station ID</label><input name="stationId" placeholder="sharma-fuel" minlength="3" maxlength="63" pattern="[a-z0-9][a-z0-9-]{2,62}" required><div class="hint">This unique ID is the customer's station login identifier.</div><label>Owner name</label><input name="ownerName" placeholder="Owner name" required><label>Owner code</label><input name="ownerCode" placeholder="OWNER-001" minlength="6" maxlength="24" pattern="[A-Za-z0-9-]{6,24}" required><label>Owner password</label><input id="ownerPassword" name="ownerPassword" type="password" minlength="12" required><label>Confirm password</label><input id="ownerPasswordConfirm" type="password" minlength="12" required><label>First package</label><select name="planCode">'+packageOptions('MONTHLY')+'</select><label>Package price (₹)</label><input name="price" type="number" min="0" step="1" value="0"><label>Grace period after expiry (days)</label><input name="graceDays" type="number" min="0" max="30" value="3"><button class="primary" style="margin-top:15px">Create station + package</button><div id="result"></div></form></section><section class="card"><h2>Subscription control</h2><p>Renew after payment, block/unblock access, manually disable a station, and see expiry dates. Reminders are automated 10 days and 3 days before expiry, on the due date, and during the grace period.</p><div id="list"><div class="muted">Loading…</div></div></section></div>';document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{try{await request('/api/admin/logout',{method:'POST'})}finally{login()}};document.getElementById('create').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=e.submitter,r=document.getElementById('result');b.disabled=true;r.innerHTML='';const pass=f.elements.namedItem('ownerPassword').value,confirmPass=document.getElementById('ownerPasswordConfirm').value;try{if(pass!==confirmPass)throw Error('Passwords do not match.');if(!passwordStrength(pass))throw Error('Owner password must contain upper/lowercase letters, a number and a symbol.');const d=await request('/api/admin/owners',{method:'POST',body:JSON.stringify({organizationName:f.elements.namedItem('organizationName').value.trim(),stationId:f.elements.namedItem('stationId').value.trim().toLowerCase(),ownerName:f.elements.namedItem('ownerName').value.trim(),ownerCode:f.elements.namedItem('ownerCode').value.trim(),ownerPassword:pass,planCode:f.elements.namedItem('planCode').value,pricePaise:Math.round(Number(f.elements.namedItem('price').value||0)*100),graceDays:Number(f.elements.namedItem('graceDays').value||3)})});r.innerHTML='<div class="success" style="margin-top:12px"><b>Station created.</b><div class="credential"><div class="credential-label">Station ID</div><div class="credential-line"><div class="secret">'+esc(d.station_slug)+'</div><button type="button" class="secondary" onclick="copyText('+JSON.stringify(d.station_slug)+',this)">Copy</button></div></div><div class="credential"><div class="credential-label">Owner code</div><div class="credential-line"><div class="secret">'+esc(d.owner_code)+'</div><button type="button" class="secondary" onclick="copyText('+JSON.stringify(d.owner_code)+',this)">Copy</button></div></div><div class="credential"><div class="credential-label">Package expires</div><div class="secret">'+esc(date(d.subscription.ends_at))+'</div></div></div>';f.reset();f.elements.namedItem('planCode').value='MONTHLY';f.elements.namedItem('graceDays').value='3';await load()}catch(x){r.innerHTML='<p class="error">'+esc(x.message)+'</p>'}finally{b.disabled=false}};await load()}
request('/api/admin/me').then(dashboard).catch(login);
</script>
</body></html>
