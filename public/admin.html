<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>FuelPulse Admin</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f7fc;color:#172033}main{max-width:1100px;margin:0 auto;padding:40px 20px}.card{background:#fff;border:1px solid #dfe6f2;border-radius:18px;padding:24px;box-shadow:0 12px 40px #17345a12;margin-bottom:20px}h1,h2{margin:0 0 10px}p{color:#68758a}label{display:block;font-weight:600;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}input[readonly]{background:#f5f7fa;color:#475569}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:#1754bd;color:white}.secondary{background:#e8eef8;color:#17345a}.danger{background:#fee2e2;color:#991b1b}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}.error{color:#b42318;background:#fff0f0;padding:10px;border-radius:9px}.success{background:#eefbf3;padding:16px;border-radius:12px}.credential{margin-top:12px}.credential-label{font-weight:700;margin-bottom:5px}.credential-line{display:flex;gap:8px;align-items:stretch}.secret{flex:1;min-width:0;font-family:ui-monospace,monospace;background:#f5f7fa;padding:10px;border-radius:7px;word-break:break-all;white-space:pre-wrap}.copied{background:#d1fae5;color:#065f46}.muted{text-align:center;padding:18px 0;color:#68758a}.hint{font-size:13px;color:#64748b;margin-top:6px}.status{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800;margin-left:8px}.enabled{background:#dcfce7;color:#166534}.disabled{background:#fee2e2;color:#991b1b}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;border-top:1px solid #edf0f5;padding:16px 0}.row:first-child{border-top:0}.org-name{font-weight:750}.meta{color:#68758a;font-size:13px;margin-top:4px}.build{font-size:11px;color:#94a3b8;margin-top:4px}@media(max-width:760px){.grid{grid-template-columns:1fr}.header{align-items:stretch;flex-direction:column}main{padding:20px 14px}.row{align-items:flex-start;flex-direction:column}.row .actions{width:100%}.row .actions button{flex:1}.credential-line{align-items:stretch}}
</style>
</head>
<body><main><div id="app"></div></main>
<script>
'use strict';
const root=document.getElementById('app');
const BUILD='admin-2026-09-13.6';
async function request(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function copyText(value,button){return (async()=>{try{if(!value)throw Error('Nothing to copy');if(navigator.clipboard&&typeof navigator.clipboard.writeText==='function')await navigator.clipboard.writeText(value);else{const a=document.createElement('textarea');a.value=value;a.setAttribute('readonly','');a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.select();if(!document.execCommand('copy'))throw Error();a.remove()}const old=button.textContent;button.textContent='Copied';button.classList.add('copied');setTimeout(()=>{button.textContent=old;button.classList.remove('copied')},1400)}catch{button.textContent='Copy failed';setTimeout(()=>button.textContent='Copy',1400)}})()}
function credential(label,id,value){return '<div class="credential"><div class="credential-label">'+label+'</div><div class="credential-line"><div class="secret" data-credential="'+id+'">'+esc(value)+'</div><button type="button" class="secondary" data-copy="'+id+'">Copy</button></div></div>'}
function wireCopy(){root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const id=b.dataset.copy;const el=root.querySelector('[data-credential="'+CSS.escape(id)+'"]');return copyText(el?.textContent?.trim()||'',b)})}
function login(){root.innerHTML='<div class="card" style="max-width:460px;margin:80px auto"><h1>FuelPulse Admin</h1><p>Private control panel. Customer owners never use this login.</p><form id="login"><label>Admin password</label><input id="password" type="password" autocomplete="current-password" minlength="16" required><button class="primary" style="margin-top:16px">Sign in</button><div id="msg"></div></form><div class="build">Build: '+BUILD+'</div></div>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg'),b=e.submitter;b.disabled=true;m.innerHTML='';try{await request('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});await dashboard()}catch(x){m.innerHTML='<p class="error">'+esc(x.message)+'</p>';b.disabled=false}}}
async function toggleOrganization(id,active){if(!confirm('Are you sure you want to '+(active?'enable':'disable')+' this organization?'))return;try{await request('/api/admin/organizations/'+encodeURIComponent(id)+'/status',{method:'PATCH',body:JSON.stringify({active})});await loadOrgs()}catch(x){alert(x.message)}}
async function dashboard(){try{await request('/api/admin/me')}catch{return login()}root.innerHTML='<div class="header"><div><h1>FuelPulse Admin</h1><p>Provision and manage customer station owners.</p><div class="build">Build: '+BUILD+'</div></div><div class="actions"><button id="refresh" type="button" class="secondary">Refresh organizations</button><button id="logout" type="button" class="danger">Sign out</button></div></div><div class="grid"><section class="card"><h2>Create owner</h2><p>Creates a new isolated organization and owner account atomically.</p><form id="create"><label>Business / station name</label><input name="organizationName" placeholder="Central Fuel Station" minlength="2" maxlength="120" required><label>Station ID</label><input name="stationId" id="stationId" placeholder="Generated automatically" readonly><div class="hint">FuelPulse generates the final unique Station ID on the server. The preview below is only an estimate.</div><label>Owner name</label><input name="ownerName" placeholder="Owner name" minlength="2" maxlength="120" required><button class="primary" style="margin-top:16px">Generate owner credentials</button><div id="result"></div></form></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h2>Organizations</h2><p style="margin-bottom:0">All customer organizations in the system.</p></div><span id="count" class="meta"></span></div><div id="orgs"><div class="muted">Loading organizations…</div></div></section></div>';
const nameInput=document.querySelector('[name="organizationName"]');const stationPreview=document.getElementById('stationId');nameInput.oninput=()=>{stationPreview.value=makePreview(nameInput.value)};
const createForm=document.getElementById('create');createForm.onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;const result=document.getElementById('result');result.innerHTML='<p>Creating organization and generating a unique Station ID…</p>';try{const body={organizationName:createForm.elements.organizationName.value.trim(),ownerName:createForm.elements.ownerName.value.trim()};const d=await request('/api/admin/owners',{method:'POST',body:JSON.stringify(body)});const stationId=d.station_slug??d.station_id??d.stationId??d.slug??'';const ownerCode=d.owner_code??d.ownerCode??d.code??'';const password=d.ownerPassword??d.owner_password??'';if(!stationId||!ownerCode||!password)throw Error('Owner was created but the server returned incomplete credentials. Please refresh organizations and contact the administrator before creating another owner.');result.innerHTML='<div class="success"><strong>Owner created successfully.</strong><p>Save these credentials now. The temporary password is shown only in this response.</p>'+credential('Station ID','station',stationId)+credential('Owner code','code',ownerCode)+credential('Temporary password','password',password)+'</div>';createForm.reset();stationPreview.value='';wireCopy();await loadOrgs()}catch(x){result.innerHTML='<p class="error">'+esc(x.message)+'</p>'}finally{button.disabled=false}};
document.getElementById('refresh').onclick=()=>void loadOrgs();document.getElementById('logout').onclick=async()=>{try{await request('/api/admin/logout',{method:'POST'})}finally{login()}};await loadOrgs()}
function makePreview(name){const base=name.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,54);return base.length>=3?base+'-••••••••':(name.trim()?'fuel-station-••••••••':'')}
async function loadOrgs(){const container=document.getElementById('orgs');if(!container)return;const refresh=document.getElementById('refresh');if(refresh)refresh.disabled=true;container.innerHTML='<div class="muted">Loading organizations…</div>';try{const rows=await request('/api/admin/organizations');const count=document.getElementById('count');if(count)count.textContent=rows.length+' organization'+(rows.length===1?'':'s');container.innerHTML=rows.length?rows.map(x=>'<div class="row"><div><div class="org-name">'+esc(x.name)+' <span class="status '+(x.active?'enabled':'disabled')+'">'+(x.active?'Enabled':'Disabled')+'</span></div><div class="meta">Station ID: '+esc(x.slug)+' · '+esc(x.active_users)+' active users</div></div><div class="actions"><button type="button" class="'+(x.active?'danger':'primary')+'" data-org-id="'+esc(x.id)+'" data-org-active="'+(!x.active)+'">'+(x.active?'Disable':'Enable')+'</button></div></div>').join(''):'<div class="muted">No organizations yet.</div>';container.querySelectorAll('[data-org-id]').forEach(b=>b.onclick=()=>void toggleOrganization(b.dataset.orgId,b.dataset.orgActive==='true'))}catch(x){container.innerHTML='<p class="error">Unable to load organizations: '+esc(x.message)+'</p>'}finally{if(refresh)refresh.disabled=false}}
dashboard();
</script></body></html>
